[package]
name = "duzenbaz"
version = "0.1.0"
description = "Düzen-Baz"
edition = "2021"

[lib]
name = "duzenbaz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2.5.0"
blake3 = "1.8.7"
trash = "5.2.9"
chrono = "0.4.45"
tauri-plugin-dialog = "2.8.4"
kamadak-exif = "0.6.1"
regex = "1.13.1"
clipboard-master = "4.1.0"
arboard = "3.7.0"
png = "0.18.1"
base64 = "0.23.1"
tauri-plugin-global-shortcut = "2.4.1"
chacha20poly1305 = "0.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.3"
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_UI_ColorSystem"] }
