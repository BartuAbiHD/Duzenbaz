[package]
name = "duzenbaz"
version = "0.1.0"
description = "Düzen-Baz"
edition = "2021"

# Masaüstü uygulaması (bu paket), ortak çekirdek ve komut satırı aracı tek bir workspace'te derlenir.
[workspace]
members = ["crates/core", "crates/cli"]

[lib]
name = "duzenbaz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
duzenbaz-core = { path = "crates/core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4.45"
clipboard-master = "4.1.0"
arboard = "3.7.0"
png = "0.18.1"
base64 = "0.23.1"

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
