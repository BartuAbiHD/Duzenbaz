name: CI

# Her push ve çekme isteğinde Linux, macOS ve Windows'ta: arayüz denetimi, tüm Rust testleri, CLI/MCP duman testi
# ve (Linux ile macOS'ta) masaüstü paketinin kurulabilir biçimde üretilebildiğinin kontrolü.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Linux sistem paketleri (Tauri için)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
          # Yalnızca testler için: sanal X sunucusu ve gerçek bir Secret Service (anahtar deposu)
          sudo apt-get install -y xvfb gnome-keyring dbus-x11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Arayüz denetimi ve derlemesi
        run: |
          npm run check
          npm run build

      - name: Rust testleri (çekirdek, uygulama, CLI ve MCP)
        run: cargo test --workspace
        working-directory: src-tauri

      - name: CLI derle
        run: cargo build --release -p duzenbaz-cli
        working-directory: src-tauri

      - name: CLI ve MCP duman testi
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          EXE=target/release/duzenbaz-cli
          [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          DATA="$RUNNER_TEMP/duzenbaz-data"
          DIR="$RUNNER_TEMP/duzenbaz-smoke"
          rm -rf "$DIR" "$DATA"; mkdir -p "$DIR"
          echo x > "$DIR/foto.jpg"; echo p > "$DIR/rapor.pdf"

          "$EXE" --version
          "$EXE" --data-dir "$DATA" organize plan "$DIR"
          "$EXE" --data-dir "$DATA" organize apply "$DIR" --yes
          test -f "$DIR/Resimler/foto.jpg"
          BATCH=$("$EXE" --data-dir "$DATA" --json organize history | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8'))[0].batchId")
          "$EXE" --data-dir "$DATA" organize undo "$BATCH"
          test -f "$DIR/foto.jpg"
          "$EXE" --data-dir "$DATA" screen-time

          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | "$EXE" --data-dir "$DATA" mcp --allow-dir "$DIR" > "$RUNNER_TEMP/mcp.out"
          cat "$RUNNER_TEMP/mcp.out"
          test "$(wc -l < "$RUNNER_TEMP/mcp.out" | tr -d ' ')" = "2"
          grep -q '"name":"organize_preview"' "$RUNNER_TEMP/mcp.out"

      # --- Linux: gerçek X sunucusu ve anahtar deposuyla çalışma zamanı testleri ---
      - name: X11 testi (boşta süre, gece modu, tuş gönderme) — Xvfb
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: xvfb-run -a cargo test -p duzenbaz-core --test x11 -- --ignored --nocapture

      - name: Anahtar deposu testi (gnome-keyring, Secret Service)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        env:
          DUZENBAZ_KEYRING_TEST: "1"
        run: |
          dbus-run-session -- bash -c '
            echo "ci-parolasi" | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo test -p duzenbaz-core real_keyring_roundtrip -- --ignored --nocapture'

      # --- macOS: Objective-C ve CoreGraphics çağrıları ---
      - name: macOS platform testi (CoreGraphics, Objective-C)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo test -p duzenbaz-core --test macos -- --ignored --nocapture

      # --- Paketleme ve uygulamanın gerçekten açıldığı ---
      - name: Masaüstü paketi (Linux .deb)
        if: runner.os == 'Linux'
        run: npm run tauri build -- --bundles deb

      - name: .deb adı geçerli mi ve kurulabiliyor mu (Linux)
        if: runner.os == 'Linux'
        run: |
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb)
          echo "dosya: $DEB"
          NAME=$(dpkg-deb -f "$DEB" Package)
          echo "Package: $NAME"
          # Debian paket adları yalnızca küçük harf, rakam, + - . içerebilir
          echo "$NAME" | grep -Eq '^[a-z0-9][a-z0-9+.-]+$'
          case "$(basename "$DEB")" in *[!A-Za-z0-9._-]*) echo "dosya adında ASCII dışı karakter var"; exit 1;; esac
          sudo apt-get install -y "./$DEB"
          test -x /usr/bin/duzenbaz

      - name: Uygulama açılış testi (Linux, Xvfb)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          set +e
          timeout 25 xvfb-run -a --server-args="-screen 0 1280x800x24" src-tauri/target/release/duzenbaz
          code=$?
          echo "çıkış kodu: $code (124 = 25 saniye boyunca çalışmaya devam etti)"
          [ "$code" = "124" ]

      # Gerçek bir masaüstü oturumunda (Xvfb + openbox) kenar çubuğundaki öğelere tıklayıp ekranın değiştiğini doğrular.
      - name: Arayüz tıklama testi (Linux, Xvfb)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          sudo apt-get install -y xdotool imagemagick openbox x11-utils
          mkdir -p shots
          cat > click-test.sh <<'SH'
          set -x
          openbox & sleep 2
          src-tauri/target/release/duzenbaz & APP=$!
          sleep 15
          xwininfo -root -tree || true
          WID=$(xdotool search --onlyvisible --name "zen-Baz" | head -1)
          echo "pencere: $WID"; xdotool getwindowgeometry "$WID"
          import -window root shots/0-ilk.png
          i=1
          for y in 90 140 190 240 290; do
            xdotool mousemove --window "$WID" 90 "$y" click 1
            sleep 2
            import -window root "shots/$i-y$y.png"
            i=$((i+1))
          done
          kill "$APP" || true
          SH
          xvfb-run -a --server-args="-screen 0 1280x800x24" bash click-test.sh
          # İlk ve son ekran farklı olmalı (tıklamalar sayfa değiştirmeli)
          if [ "$(compare -metric AE shots/0-ilk.png shots/5-y290.png null: 2>&1 | cut -d' ' -f1)" = "0" ]; then echo "tıklamalar ekranı değiştirmedi"; exit 1; fi

      - name: Ekran görüntülerini yükle
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-ui-shots
          path: shots/*.png
          if-no-files-found: ignore

      - name: Masaüstü paketi (macOS .app)
        if: runner.os == 'macOS'
        run: npm run tauri build -- --bundles app

      - name: macOS paket adı ve görünen ad
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app)
          echo "paket: $APP"
          [ "$(basename "$APP")" = "Duzen-Baz.app" ]
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Contents/Info.plist" | grep -qx "Düzen-Baz"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$APP/Contents/Info.plist"

      - name: Uygulama açılış testi (macOS)
        if: runner.os == 'macOS'
        run: |
          BIN=$(ls src-tauri/target/release/bundle/macos/*.app/Contents/MacOS/* | head -1)
          echo "çalıştırılıyor: $BIN"
          "$BIN" &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            echo "uygulama 20 saniye boyunca çalışmaya devam etti"
            kill "$PID"
          else
            wait "$PID"; echo "uygulama erken çıktı, kod: $?"; exit 1
          fi
